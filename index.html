<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f5f9">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<title>Family Hub</title>
<script>
  document.documentElement.dataset.theme = localStorage.getItem('hub_tema') || 'light';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --inputbg:#f8fafc; --accent:#0f172a; --btn:#ffffff; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
    --danger:#EF4444;
  }
  [data-theme="dark"]{
    --bg:#0b1120; --card:#131c2e; --text:#f8fafc; --muted:#94a3b8; --border:#1f2b40;
    --inputbg:#0f1829; --accent:#f8fafc; --btn:#0b1120; --shadow:none; --danger:#F87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:16px;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  input,select{outline:none}
  input:focus,select:focus{border-color:var(--accent)!important}
  [hidden]{display:none!important}
  .muted{color:var(--muted);font-size:13px}
  .empty,.noev{color:var(--muted);font-size:14px;padding:4px 2px;font-style:italic}
  label{display:grid;gap:6px;font-size:14px;color:var(--muted)}

  /* Estructura */
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px;gap:10px}
  header{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:6px 14px;box-shadow:var(--shadow);height:58px;flex-shrink:0}
  .clock{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .date{font-size:14px;color:var(--muted)}
  .sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;flex-shrink:0}
  .sync.live .dot{background:#10B981}
  .sync.local .dot{background:#F59E0B}
  .sync.warn .dot{background:var(--danger)}
  .head-actions{display:flex;gap:8px;margin-left:auto}
  .icon-btn{width:40px;height:40px;border-radius:12px;background:var(--inputbg);border:1px solid var(--border);display:grid;place-items:center;color:var(--text)}
  .icon-btn svg{width:20px;height:20px}

  .grid{flex:1;min-height:0;display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1.1fr 1fr;grid-template-areas:"cal cal compra" "comidas comidas tareas"}
  .p-cal{grid-area:cal}.p-avisos{grid-area:avisos}.p-comidas{grid-area:comidas}.p-tareas{grid-area:tareas}.p-compra{grid-area:compra}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-shrink:0;flex-wrap:wrap}
  .panel-h h2{font-size:16px;font-weight:700}
  .scroll{flex:1;min-height:0;overflow:auto}
  .row{display:flex;gap:8px;align-items:center}
  .list{list-style:none}
  .foot{margin-top:8px;flex-shrink:0}

  /* Controles */
  .field{width:100%;padding:8px 10px;border-radius:12px;border:1px solid var(--border);background:var(--inputbg);font-size:15px}
  .sel{width:auto;min-width:110px}
  .btn{padding:8px 14px;border-radius:12px;background:var(--accent);color:var(--btn);font-weight:700;font-size:14px;white-space:nowrap}
  .ghost{padding:7px 11px;border-radius:12px;border:1px solid var(--border);color:var(--text);font-weight:600;font-size:13px;white-space:nowrap}
  .danger{color:var(--danger)}
  .check{display:flex;align-items:center;gap:8px;font-size:15px}
  .check input{width:18px;height:18px;accent-color:var(--danger)}
  .grow{flex:1}
  .tabs{display:flex;gap:6px;margin-bottom:8px;flex-shrink:0}
  .tab{flex:1;padding:6px 8px;border-radius:10px;border:1px solid var(--border);background:var(--inputbg);font-weight:600;font-size:14px}
  .tab.on{background:var(--accent);color:var(--btn);border-color:var(--accent)}

  /* Calendario y tiempo */
  .cal-top{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-shrink:0}
  .wx-sticker{flex-shrink:0;width:78px;height:78px;display:grid;place-items:center}
  .wx-sticker svg{width:100%;height:100%}
  .wx-temp{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .wx-desc{font-size:13px;color:var(--muted);margin-top:2px}
  .cal-hoy{flex:1;font-size:18px;font-weight:700;text-align:right}
  .week{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .dday{background:var(--inputbg);border:1px solid var(--border);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto}
  .dday.today{border-color:var(--accent)}
  .dday-h{font-weight:700;font-size:13px;padding-bottom:3px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:4px}
  .dday-h .muted{font-size:11px}
  .ev{position:relative;padding:4px 6px 4px 10px;border-radius:8px;background:var(--card);cursor:pointer}
  .ev::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:4px;border-radius:3px;background:var(--c)}
  .ev-time{font-size:10px;color:var(--muted)}
  .ev-title{font-size:12px;font-weight:600;line-height:1.2}

  /* Comidas */
  .cole{flex:1;min-height:0;display:flex;flex-direction:column}
  .wk-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;flex-shrink:0}
  .wk-nav .rango{font-weight:700;font-size:13px}
  .cole-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;overflow:auto}
  .dcard{background:var(--inputbg);border:1px solid var(--border);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto}
  .dcard.today{border-color:var(--accent)}
  .dcard-h{display:flex;flex-direction:column;font-weight:700;font-size:13px;padding-bottom:4px;border-bottom:1px solid var(--border)}
  .dcard-h .muted{font-size:11px}
  .plato{font-size:12px;line-height:1.25}
  .festivo{font-weight:800;color:var(--danger);font-size:13px}
  .item-cena{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:10px;background:var(--inputbg);border:1px solid var(--border);margin-bottom:5px;cursor:pointer;text-align:left;width:100%}
  .item-cena .dn{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .item-cena .val{font-size:14px}
  .item-cena .val.empty{color:var(--muted);font-style:italic}

  /* Tareas */
  .kids{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kid{display:flex;flex-direction:column;gap:6px;min-height:0;padding:10px;border-radius:14px;border:1px solid var(--border);background:color-mix(in srgb,var(--c) 7%,var(--card))}
  .kid-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .kid-id{display:flex;align-items:center;gap:6px}
  .kid-id svg{width:36px;height:36px;flex-shrink:0}
  .kid-name{font-size:18px;font-weight:800;color:var(--c)}
  .stars{font-size:18px;font-weight:800;color:#F59E0B;font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:8px;background:var(--border);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
  .meta{font-size:12px;color:var(--muted)}
  .premio{font-size:13px;padding:4px 8px;border-radius:10px;background:var(--inputbg);border:1px dashed var(--border);text-align:left}
  .routines{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .routine{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 10px;border-radius:14px;background:var(--inputbg);border:2px solid var(--border);text-align:left;font-size:17px;font-weight:600}
  .routine .check-b{width:28px;height:28px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0}
  .routine .rname{flex:1;line-height:1.2}
  .routine .rpts{font-size:12px;color:var(--muted);white-space:nowrap}
  .routine.done{background:color-mix(in srgb,var(--c) 16%,var(--card));border-color:var(--c)}
  .routine.done .check-b{background:var(--c)}
  .routine.done .rname{text-decoration:line-through;opacity:.7}
  .reset{width:100%;flex-shrink:0}

  /* Compra y avisos */
  #form-compra{margin-bottom:8px;flex-shrink:0}
  .item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--inputbg);margin-bottom:6px;cursor:pointer;font-size:15px}
  .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;flex-shrink:0;color:#fff}
  .item.done .box{background:#10B981;border-color:#10B981}
  .item.done .txt{text-decoration:line-through;color:var(--muted)}
  .stack{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;flex-shrink:0}
  .note{background:color-mix(in srgb,var(--c) 12%,var(--inputbg));border-left:5px solid var(--c);border-radius:12px;padding:7px 10px;margin-bottom:6px}
  .note.urgent{box-shadow:inset 0 0 0 2px var(--danger)}
  .note-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--c)}
  .note-h .urg{color:var(--danger)}
  .note p{font-size:14px;margin-top:2px;white-space:pre-wrap;word-break:break-word;line-height:1.3}
  .x{width:28px;height:28px;border-radius:8px;font-size:18px;line-height:1;color:var(--muted)}

  /* Modales */
  .modal{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.show{display:flex}
  .sheet{background:var(--card);border-radius:20px;padding:20px;width:min(480px,100%);border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px}
  .sheet h3{font-size:18px}
  .sheet p{font-size:13px;color:var(--muted);line-height:1.4}
  .form-grid{display:grid;gap:10px}
  .sheet-actions{display:flex;justify-content:flex-end;gap:10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;transition:transform .3s;font-weight:600;z-index:60;max-width:90vw;text-align:center}
  .toast.show{transform:translate(-50%,0)}

  @media (max-width:900px){
    body{overflow:auto}
    .app{height:auto;min-height:100dvh}
    .grid{grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"cal" "comidas" "tareas" "compra"}
    .panel{min-height:320px}
    .cole-grid{grid-template-columns:repeat(5,minmax(130px,1fr))}
    .week{grid-template-columns:repeat(7,minmax(120px,1fr));overflow-x:auto}
    header{flex-wrap:wrap;height:auto}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="clock" id="clock">--:--</div>
    <div>
      <div class="date" id="fecha">&nbsp;</div>
      <div class="sync" id="sync"><span class="dot"></span><span id="syncText">Conectando…</span></div>
    </div>
    <div class="head-actions">
      <button class="icon-btn" id="btn-tema" aria-label="Modo claro u oscuro" title="Modo claro/oscuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="btn-config" aria-label="Configuración" title="Configuración">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="grid">
    <!-- Calendario de la semana en curso -->
    <section class="panel p-cal">
      <div class="cal-top">
        <div class="wx-sticker" id="wx-sticker" aria-hidden="true"></div>
        <div>
          <div class="wx-temp" id="wx-temp">--°</div>
          <div class="wx-desc" id="wx-desc">Cargando clima…</div>
        </div>
        <div class="cal-hoy" id="cal-hoy"></div>
        <button class="btn" id="btn-evento">+ Evento</button>
      </div>
      <div class="week" id="week"></div>
    </section>

    <!-- Comidas: colegio y cena -->
    <section class="panel p-comidas">
      <div class="panel-h"><h2>Comidas</h2></div>
      <div class="tabs">
        <button class="tab on" data-act="tab" data-id="colegio">Colegio</button>
        <button class="tab" data-act="tab" data-id="cena">Cena</button>
      </div>
      <div class="cole" id="view-colegio">
        <div class="wk-nav">
          <button class="ghost" data-act="semana" data-id="-7" aria-label="Semana anterior">‹ Anterior</button>
          <span class="rango" id="cole-rango"></span>
          <button class="ghost" data-act="semana" data-id="7" aria-label="Semana siguiente">Siguiente ›</button>
        </div>
        <div class="cole-grid" id="cole-grid"></div>
      </div>
      <div class="scroll" id="view-cena" hidden>
        <div id="cena-lista"></div>
      </div>
    </section>

    <!-- Tareas y recompensas -->
    <section class="panel p-tareas">
      <div class="panel-h"><h2>Tareas y recompensas</h2></div>
      <div class="kids">
        <div class="kid" id="kid-alvaro" style="--c:#F97316">
          <div class="kid-h">
            <div class="kid-id"><span data-kid-svg="#F97316"></span><span class="kid-name">Álvaro</span></div>
            <span class="stars">★ 0</span>
          </div>
          <div class="bar"><i></i></div>
          <div class="meta meta-txt"></div>
          <button class="premio premio-txt" data-act="premio" data-id="alvaro"></button>
          <div class="routines"></div>
          <button class="ghost reset" data-act="reset" data-id="alvaro">Reiniciar día</button>
        </div>
        <div class="kid" id="kid-ignacio" style="--c:#8B5CF6">
          <div class="kid-h">
            <div class="kid-id"><span data-kid-svg="#8B5CF6"></span><span class="kid-name">Ignacio</span></div>
            <span class="stars">★ 0</span>
          </div>
          <div class="bar"><i></i></div>
          <div class="meta meta-txt"></div>
          <button class="premio premio-txt" data-act="premio" data-id="ignacio"></button>
          <div class="routines"></div>
          <button class="ghost reset" data-act="reset" data-id="ignacio">Reiniciar día</button>
        </div>
      </div>
    </section>

    <!-- Compra -->
    <section class="panel p-compra">
      <div class="panel-h"><h2>Lista de la compra</h2><span class="muted" id="compra-count"></span></div>
      <form class="row" id="form-compra" autocomplete="off">
        <input class="field" id="in-compra" placeholder="Añadir producto…" maxlength="60">
        <button class="btn" type="submit">Añadir</button>
      </form>
      <ul class="scroll list" id="lista-compra"></ul>
      <div class="row foot">
        <button class="ghost" id="btn-limpiar">Quitar comprados</button>
        <button class="ghost danger" id="btn-vaciar">Vaciar</button>
      </div>
    </section>
  </main>
</div>

<!-- Modal: evento -->
<div class="modal" id="m-evento">
  <form class="sheet" id="form-evento">
    <h3>Nuevo evento</h3>
    <div class="form-grid">
      <label>Título<input class="field" id="ev-titulo" required maxlength="80"></label>
      <label>Miembro<select class="field" id="ev-miembro"></select></label>
      <label>Fecha<input class="field" type="date" id="ev-fecha" required></label>
      <div class="row">
        <label class="grow">Inicio<input class="field" type="time" id="ev-ini" required></label>
        <label class="grow">Fin (opcional)<input class="field" type="time" id="ev-fin"></label>
      </div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="ghost" data-close="m-evento">Cancelar</button>
      <button class="btn" type="submit">Guardar</button>
    </div>
  </form>
</div>

<!-- Modal: editar comida o cena -->
<div class="modal" id="m-menu">
  <form class="sheet" id="form-menu">
    <h3 id="menu-titulo">Menú</h3>
    <input type="hidden" id="menu-id">
    <input class="field" id="menu-in" placeholder="Ej: Lentejas con chorizo" maxlength="80">
    <div class="sheet-actions">
      <button type="button" class="ghost" data-close="m-menu">Cancelar</button>
      <button class="btn" type="submit">Guardar</button>
    </div>
  </form>
</div>

<!-- Modal: configuración -->
<div class="modal" id="m-config">
  <form class="sheet" id="form-config">
    <h3>Configuración</h3>
    <p>Credenciales de Supabase. Se guardan solo en este navegador. Usa la clave pública anon.</p>
    <div class="form-grid">
      <label>URL de Supabase<input class="field" type="url" id="cfg-url" placeholder="https://xxxx.supabase.co"></label>
      <label>Anon Key<input class="field" type="text" id="cfg-key" placeholder="eyJhbGciOi…" autocomplete="off"></label>
    </div>
    <div class="row" style="flex-wrap:wrap;justify-content:space-between">
      <button type="button" class="ghost danger" id="btn-desconectar">Desconectar</button>
      <button type="button" class="ghost" id="btn-borrar-local">Borrar datos locales</button>
    </div>
    <div class="sheet-actions">
      <button type="button" class="ghost" data-close="m-config">Cancelar</button>
      <button class="btn" type="submit">Guardar y conectar</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   CONSTANTES Y UTILIDADES
   ========================================================= */
const MIEMBROS = {
  papa:    { nombre: 'Papá',    color: '#3B82F6' },
  mama:    { nombre: 'Mamá',    color: '#10B981' },
  alvaro:  { nombre: 'Álvaro',  color: '#F97316' },
  ignacio: { nombre: 'Ignacio', color: '#8B5CF6' }
};
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const TAREAS_DEFAULT = [
  { nombre: 'Recoger los juguetes', estrellas: 1 },
  { nombre: 'Vestirse solos', estrellas: 1 },
  { nombre: 'Recoger la mesa de la cena', estrellas: 1 },
  { nombre: 'No pelearse', estrellas: 2 }
];
const META_ESTRELLAS = 20;
const TABLAS = ['tareas','menu','menu_colegio','compras','eventos'];
const TABLAS_POR_ID = ['menu','menu_colegio'];
const LS = { url: 'hub_supabase_url', key: 'hub_supabase_key', tema: 'hub_tema' };

let sb = null;
let modoRemoto = false;
let vistaComidas = 'colegio';
let semanaCole = null;
let wx = null;
const estado = { tareas: [], menu: [], menu_colegio: [], compras: [], eventos: [] };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pad = n => String(n).padStart(2, '0');
const uid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
  const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
});
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hora = d => d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
const lunesDe = d => { const x = startOfDay(d); return addDays(x, -((x.getDay() + 6) % 7)); };

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2800);
}
async function accion(fn) {
  try { await fn(); }
  catch (e) { console.error(e); toast('Error: ' + (e.message || 'no se pudo guardar')); }
}
const abrir = id => $(id).classList.add('show');
const cerrar = id => $(id).classList.remove('show');

/* =========================================================
   CAPA DE DATOS (Supabase o localStorage como respaldo)
   ========================================================= */
const Local = {
  get(t) { try { return JSON.parse(localStorage.getItem('hub_local_' + t)) || []; } catch { return []; } },
  set(t, rows) { localStorage.setItem('hub_local_' + t, JSON.stringify(rows)); }
};
const ordenar = (t, rows) => rows.sort((a, b) => TABLAS_POR_ID.includes(t)
  ? String(a.id).localeCompare(String(b.id))
  : String(a.created_at || '').localeCompare(String(b.created_at || '')));

const db = {
  async select(t) {
    if (!modoRemoto) return ordenar(t, Local.get(t));
    const { data, error } = await sb.from(t).select('*').order(TABLAS_POR_ID.includes(t) ? 'id' : 'created_at', { ascending: true });
    if (error) throw error;
    return data;
  },
  async save(t, row) {
    if (!modoRemoto) {
      const rows = Local.get(t);
      const i = rows.findIndex(r => r.id === row.id);
      const full = { created_at: new Date().toISOString(), ...(i >= 0 ? rows[i] : {}), ...row };
      if (i >= 0) rows[i] = full; else rows.push(full);
      Local.set(t, rows);
      return;
    }
    const { error } = await sb.from(t).upsert(row);
    if (error) throw error;
  },
  async patch(t, id, cambios) {
    if (!modoRemoto) {
      const rows = Local.get(t);
      const r = rows.find(x => x.id === id);
      if (r) Object.assign(r, cambios);
      Local.set(t, rows);
      return;
    }
    const { error } = await sb.from(t).update(cambios).eq('id', id);
    if (error) throw error;
  },
  async remove(t, ids) {
    if (!ids.length) return;
    if (!modoRemoto) { Local.set(t, Local.get(t).filter(r => !ids.includes(r.id))); return; }
    const { error } = await sb.from(t).delete().in('id', ids);
    if (error) throw error;
  }
};

async function cargar(t) { estado[t] = await db.select(t); render(t); }
async function cargarTodo() { for (const t of TABLAS) await cargar(t); }

async function asegurarDefectos() {
  for (const m of ['alvaro', 'ignacio']) {
    const mios = estado.tareas.filter(x => x.miembro === m);
    if (!mios.some(x => x.tipo === 'contador'))
      await db.save('tareas', { id: uid(), miembro: m, nombre: 'Estrellas', tipo: 'contador', completada: false, estrellas: 0 });
    const rutinas = mios.filter(x => x.tipo === 'rutina');
    const actuales = rutinas.map(x => x.nombre).sort().join('|');
    const esperadas = TAREAS_DEFAULT.map(t => t.nombre).sort().join('|');
    if (actuales !== esperadas) {
      await db.remove('tareas', rutinas.map(x => x.id));
      for (const t of TAREAS_DEFAULT)
        await db.save('tareas', { id: uid(), miembro: m, nombre: t.nombre, tipo: 'rutina', completada: false, estrellas: t.estrellas });
    }
  }
  await cargar('tareas');
}

function conectarRealtime() {
  const canal = sb.channel('family-hub');
  TABLAS.forEach(t => canal.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => cargar(t)));
  canal.subscribe(status => {
    if (status === 'SUBSCRIBED') setSync('live', 'Sincronizado en tiempo real');
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setSync('warn', 'Reconectando…');
  });
}
function setSync(kind, text) {
  $('#sync').className = 'sync ' + kind;
  $('#syncText').textContent = text;
}

/* =========================================================
   RENDER
   ========================================================= */
function render(t) {
  const fn = {
    tareas: renderTareas, compras: renderCompras,
    eventos: renderCalendario, menu: renderCena, menu_colegio: renderColegio
  }[t];
  if (fn) fn();
}

  <circle cx="20" cy="13" r="9" fill="#FBD3A5" stroke="#fff" stroke-width="2.5"/>
  <path d="M11 12 Q20 1 29 12 Q25 7 20 7 Q14 7 11 12Z" fill="#3f2a1a"/>
  <rect x="9" y="24" width="22" height="14" rx="6" fill="${c}" stroke="#fff" stroke-width="2.5"/>
  <circle cx="17" cy="13" r="1.4" fill="#1e293b"/><circle cx="23" cy="13" r="1.4" fill="#1e293b"/>
</svg>`;
document.querySelectorAll('[data-kid-svg]').forEach(el => el.innerHTML = kidSvg(el.dataset.kidSvg));

function renderTareas() {
  ['alvaro', 'ignacio'].forEach(m => {
    const cont = $('#kid-' + m);
    const rutinas = estado.tareas.filter(x => x.miembro === m && x.tipo === 'rutina');
    const contador = estado.tareas.find(x => x.miembro === m && x.tipo === 'contador');
    const est = contador ? contador.estrellas : 0;
    const hechas = rutinas.filter(r => r.completada).length;
    cont.querySelector('.stars').textContent = '★ ' + est;
    cont.querySelector('.bar i').style.width = Math.min(100, est / META_ESTRELLAS * 100) + '%';
    cont.querySelector('.meta-txt').textContent = est >= META_ESTRELLAS
      ? '¡Premio conseguido!'
      : `Faltan ${META_ESTRELLAS - est} ★ para el premio · ${hechas}/${rutinas.length} hoy`;
    cont.querySelector('.premio-txt').textContent =
      'Premio: ' + (localStorage.getItem('hub_premio_' + m) || 'toca para escribirlo');
    cont.querySelector('.routines').innerHTML = rutinas.map(r => `
      <button class="routine ${r.completada ? 'done' : ''}" data-act="rutina" data-id="${r.id}" style="--c:${MIEMBROS[m].color}">
        <span class="check-b">${r.completada ? '✓' : ''}</span>
        <span class="rname">${esc(r.nombre)}</span>
        <span class="rpts">+${r.estrellas}★</span>
      </button>`).join('') || '<p class="empty">Sin tareas</p>';
  });
}

function renderCompras() {
  const items = [...estado.compras].sort((a, b) => (a.comprado - b.comprado) || String(a.created_at || '').localeCompare(String(b.created_at || '')));
  $('#lista-compra').innerHTML = items.length ? items.map(i => `
    <li class="item ${i.comprado ? 'done' : ''}" data-act="compra" data-id="${i.id}">
      <span class="box">${i.comprado ? '✓' : ''}</span>
      <span class="txt">${esc(i.nombre)}</span>
    </li>`).join('') : '<li class="empty">Lista vacía</li>';
  $('#compra-count').textContent = `${items.filter(i => !i.comprado).length} pendientes`;
}

function renderCena() {
  $('#cena-lista').innerHTML = DIAS.map((d, i) => {
    const p = estado.menu.find(x => x.id === `${i}-cena`)?.plato || '';
    return `<button class="item-cena" data-act="menu" data-id="${i}-cena">
      <span class="dn">${d}</span>
      <span class="val ${p ? '' : 'empty'}">${p ? esc(p) : 'Añadir cena'}</span>
    </button>`;
  }).join('');
}

function renderColegio() {
  if (!semanaCole) semanaCole = lunesDe(new Date());
  const fin = addDays(semanaCole, 4);
  $('#cole-rango').textContent = `${semanaCole.getDate()} ${MESES[semanaCole.getMonth()]} – ${fin.getDate()} ${MESES[fin.getMonth()]}`;
  const hoyIso = isoLocal(new Date());
  $('#cole-grid').innerHTML = [0, 1, 2, 3, 4].map(i => {
    const d = addDays(semanaCole, i);
    const iso = isoLocal(d);
    const r = estado.menu_colegio.find(x => x.fecha === iso);
    const lineas = r && r.platos ? r.platos.split('\n').filter(Boolean) : [];
    let cuerpo;
    if (r && r.festivo) cuerpo = '<div class="festivo">FESTIVO</div>';
    else if (lineas.length) cuerpo = lineas.map(l => `<div class="plato">${esc(l)}</div>`).join('');
    else cuerpo = '<div class="noev">Sin menú cargado</div>';
    return `<div class="dcard ${iso === hoyIso ? 'today' : ''}">
      <div class="dcard-h"><span>${DIAS[i]}</span><span class="muted">${d.getDate()} ${MESES[d.getMonth()]}</span></div>
      ${cuerpo}
    </div>`;
  }).join('');
}

function setVistaComidas(v) {
  vistaComidas = v;
  document.querySelectorAll('[data-act="tab"]').forEach(b => b.classList.toggle('on', b.dataset.id === v));
  $('#view-colegio').hidden = v !== 'colegio';
  $('#view-cena').hidden = v !== 'cena';
}

/* ---------- Calendario semanal ---------- */
function eventoHTML(e) {
  const m = MIEMBROS[e.miembro] || { nombre: e.miembro, color: '#64748b' };
  const cuando = e.todo_dia ? 'Todo el día' : hora(new Date(e.inicio));
  return `<div class="ev" data-act="delEvento" data-id="${e.id}" style="--c:${m.color}" title="Tocar para borrar">
    <div class="ev-time">${cuando} · ${esc(m.nombre)}</div>
    <div class="ev-title">${esc(e.titulo)}</div>
  </div>`;
}

function renderCalendario() {
  const hoy = startOfDay(new Date());
  const lunes = lunesDe(hoy);
  $('#cal-hoy').textContent = `${cap(hoy.toLocaleDateString('es-ES', { weekday: 'long' }))}, ${hoy.getDate()} de ${hoy.toLocaleDateString('es-ES', { month: 'long' })}`;
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(lunes, i), fin = addDays(d, 1);
    const evs = estado.eventos
      .filter(e => { const t = new Date(e.inicio); return t >= d && t < fin; })
      .sort((a, b) => new Date(a.inicio) - new Date(b.inicio));
    const esHoy = d.getTime() === hoy.getTime();
    html += `<div class="dday ${esHoy ? 'today' : ''}">
      <div class="dday-h"><span>${DIAS[i].slice(0, 3)}</span><span class="muted">${d.getDate()} ${MESES[d.getMonth()]}</span></div>
      ${evs.length ? evs.map(eventoHTML).join('') : '<div class="noev">Sin eventos</div>'}
    </div>`;
  }
  $('#week').innerHTML = html;
}

/* ---------- Tiempo y stickers ---------- */
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=40.4168&longitude=-3.7038&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FMadrid&forecast_days=1';

function wxTexto(c) {
  if (c === 0) return 'Despejado';
  if (c <= 2) return 'Poco nuboso';
  if (c === 3) return 'Nublado';
  if (c <= 48) return 'Niebla';
  if (c <= 57) return 'Llovizna';
  if (c <= 67) return 'Lluvia';
  if (c <= 77) return 'Nieve';
  if (c <= 82) return 'Chubascos';
  if (c <= 86) return 'Nieve';
  return 'Tormenta';
}
const esLluvia = c => (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95;
const esSoleado = c => c === 0 || c === 1;

const paraguas = () => `<path d="M78 26 Q98 -4 118 26 Z" fill="#3B82F6" stroke="#fff" stroke-width="2"/>
  <path d="M98 26 L98 44 Q98 50 92 48" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>`;

function pinguino(lluvia) {
  return `<svg viewBox="0 0 120 120" aria-hidden="true">
    <ellipse cx="60" cy="66" rx="34" ry="42" fill="#1e293b" stroke="#fff" stroke-width="3"/>
    <ellipse cx="60" cy="76" rx="22" ry="30" fill="#f8fafc"/>
    <circle cx="50" cy="42" r="6" fill="#fff"/><circle cx="70" cy="42" r="6" fill="#fff"/>
    <circle cx="51" cy="43" r="2.6" fill="#1e293b"/><circle cx="69" cy="43" r="2.6" fill="#1e293b"/>
    <polygon points="54,50 66,50 60,60" fill="#F59E0B"/>
    <rect x="36" y="56" width="48" height="10" rx="5" fill="#EF4444"/>
    <rect x="72" y="62" width="8" height="18" rx="3" fill="#EF4444"/>
    <ellipse cx="46" cy="110" rx="9" ry="4" fill="#F59E0B"/><ellipse cx="74" cy="110" rx="9" ry="4" fill="#F59E0B"/>
    ${lluvia ? paraguas() : ''}
  </svg>`;
}

function tigre(gafas, lluvia) {
  return `<svg viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="28" cy="30" r="12" fill="#F97316" stroke="#fff" stroke-width="3"/>
    <circle cx="92" cy="30" r="12" fill="#F97316" stroke="#fff" stroke-width="3"/>
    <circle cx="60" cy="62" r="40" fill="#F97316" stroke="#fff" stroke-width="3"/>
    <g stroke="#1e293b" stroke-width="5" stroke-linecap="round">
      <path d="M60 24 L60 36"/><path d="M44 28 L48 38"/><path d="M76 28 L72 38"/>
      <path d="M22 60 L32 62"/><path d="M98 60 L88 62"/>
    </g>
    <ellipse cx="60" cy="80" rx="20" ry="14" fill="#FEF3C7"/>
    <path d="M55 72 L65 72 L60 78Z" fill="#1e293b"/>
    <path d="M60 78 Q54 86 48 82 M60 78 Q66 86 72 82" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    ${gafas
      ? `<g fill="#111827"><rect x="30" y="50" width="26" height="18" rx="6"/><rect x="64" y="50" width="26" height="18" rx="6"/></g>
         <rect x="56" y="55" width="8" height="4" fill="#111827"/>`
      : `<circle cx="44" cy="58" r="4" fill="#1e293b"/><circle cx="76" cy="58" r="4" fill="#1e293b"/>`}
    ${lluvia ? paraguas() : ''}
  </svg>`;
}

function stickerTiempo(max, codigo) {
  const lluvia = esLluvia(codigo);
  if (max < 15) return pinguino(lluvia);
  return tigre(esSoleado(codigo), lluvia);
}

function renderClima() {
  if (!wx) return;
  $('#wx-temp').textContent = wx.temp + '°';
  $('#wx-desc').textContent = `${wxTexto(wx.codigo)} · máx ${wx.max}° · mín ${wx.min}°`;
  $('#wx-sticker').innerHTML = stickerTiempo(wx.max, wx.codigo);
}

async function clima() {
  try {
    const r = await fetch(WX_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    wx = {
      temp: Math.round(j.current.temperature_2m),
      codigo: j.current.weather_code,
      max: Math.round(j.daily.temperature_2m_max[0]),
      min: Math.round(j.daily.temperature_2m_min[0])
    };
    renderClima();
  } catch (e) {
    console.warn(e);
    $('#wx-desc').textContent = 'Clima no disponible';
  }
}

/* ---------- Reloj y tema ---------- */
function tick() {
  const d = new Date();
  $('#clock').textContent = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  $('#fecha').textContent = cap(d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }));
}
function setTema(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem(LS.tema, t);
}

/* =========================================================
   ACCIONES
   ========================================================= */
async function toggleRutina(id) {
  const r = estado.tareas.find(x => x.id === id);
  if (!r) return;
  const nuevo = !r.completada;
  const contador = estado.tareas.find(x => x.miembro === r.miembro && x.tipo === 'contador');
  await db.patch('tareas', id, { completada: nuevo });
  if (contador) {
    const total = Math.max(0, contador.estrellas + (nuevo ? r.estrellas : -r.estrellas));
    await db.patch('tareas', contador.id, { estrellas: total });
  }
  await cargar('tareas');
}

async function reiniciarDia(miembro) {
  const hechas = estado.tareas.filter(x => x.miembro === miembro && x.tipo === 'rutina' && x.completada);
  for (const r of hechas) await db.patch('tareas', r.id, { completada: false });
  await cargar('tareas');
  toast('Tareas reiniciadas. Las estrellas se mantienen.');
}

function editarPremio(m) {
  const actual = localStorage.getItem('hub_premio_' + m) || '';
  const nuevo = prompt(`Premio de ${MIEMBROS[m].nombre} al llegar a ${META_ESTRELLAS} estrellas:`, actual);
  if (nuevo === null) return;
  localStorage.setItem('hub_premio_' + m, nuevo.trim());
  renderTareas();
}

async function toggleCompra(id) {
  const it = estado.compras.find(x => x.id === id);
  if (!it) return;
  await db.patch('compras', id, { comprado: !it.comprado });
  await cargar('compras');
}

function abrirEvento() {
  $('#form-evento').reset();
  $('#ev-fecha').value = isoLocal(new Date());
  abrir('#m-evento');
  setTimeout(() => $('#ev-titulo').focus(), 50);
}

function abrirMenu(id) {
  const [dia, tipo] = id.split('-');
  const actual = estado.menu.find(x => x.id === id)?.plato || '';
  $('#menu-titulo').textContent = `${DIAS[+dia]} · ${tipo === 'comida' ? 'Comida' : 'Cena'}`;
  $('#menu-id').value = id;
  $('#menu-in').value = actual;
  abrir('#m-menu');
  setTimeout(() => $('#menu-in').focus(), 50);
}

function abrirConfig() {
  $('#cfg-url').value = localStorage.getItem(LS.url) || '';
  $('#cfg-key').value = localStorage.getItem(LS.key) || '';
  abrir('#m-config');
}

/* =========================================================
   EVENTOS DE INTERFAZ
   ========================================================= */
document.addEventListener('click', e => {
  const cierre = e.target.closest('[data-close]');
  if (cierre) { cerrar('#' + cierre.dataset.close); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id } = el.dataset;

  if (act === 'rutina') accion(() => toggleRutina(id));
  else if (act === 'reset') accion(() => reiniciarDia(id));
  else if (act === 'premio') editarPremio(id);
  else if (act === 'compra') accion(() => toggleCompra(id));
  else if (act === 'menu') abrirMenu(id);
  else if (act === 'tab') setVistaComidas(id);
  else if (act === 'semana') { semanaCole = addDays(semanaCole || lunesDe(new Date()), +id); renderColegio(); }
  else if (act === 'delEvento' && confirm('¿Borrar este evento?'))
    accion(async () => { await db.remove('eventos', [id]); await cargar('eventos'); });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show'));
});
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));

$('#btn-tema').onclick = () => setTema(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#btn-config').onclick = abrirConfig;
$('#btn-evento').onclick = abrirEvento;

$('#form-compra').onsubmit = e => {
  e.preventDefault();
  const v = $('#in-compra').value.trim();
  if (!v) return;
  $('#in-compra').value = '';
  accion(async () => {
    await db.save('compras', { id: uid(), nombre: v, comprado: false, created_at: new Date().toISOString() });
    await cargar('compras');
  });
};
$('#btn-limpiar').onclick = () => accion(async () => {
  await db.remove('compras', estado.compras.filter(x => x.comprado).map(x => x.id));
  await cargar('compras');
});
$('#btn-vaciar').onclick = () => {
  if (confirm('¿Vaciar toda la lista de la compra?'))
    accion(async () => { await db.remove('compras', estado.compras.map(x => x.id)); await cargar('compras'); });
};

$('#form-evento').onsubmit = e => {
  e.preventDefault();
  const titulo = $('#ev-titulo').value.trim(), miembro = $('#ev-miembro').value;
  const f = $('#ev-fecha').value, hi = $('#ev-ini').value, hf = $('#ev-fin').value;
  if (!titulo || !f || !hi) return;
  const inicio = new Date(`${f}T${hi}`);
  let fin = hf ? new Date(`${f}T${hf}`) : new Date(inicio.getTime() + 3600000);
  if (fin <= inicio) fin = new Date(inicio.getTime() + 3600000);
  accion(async () => {
    await db.save('eventos', { id: uid(), titulo, miembro, inicio: inicio.toISOString(), fin: fin.toISOString(), todo_dia: false });
    cerrar('#m-evento');
    await cargar('eventos');
    toast('Evento añadido');
  });
};

$('#form-menu').onsubmit = e => {
  e.preventDefault();
  const id = $('#menu-id').value;
  const [dia, tipo] = id.split('-');
  const plato = $('#menu-in').value.trim();
  accion(async () => {
    await db.save('menu', { id, dia: +dia, tipo, plato });
    cerrar('#m-menu');
    await cargar('menu');
  });
};

$('#form-config').onsubmit = e => {
  e.preventDefault();
  const url = $('#cfg-url').value.trim(), key = $('#cfg-key').value.trim();
  if (!url || !key) { toast('Introduce la URL y la clave'); return; }
  if (!/^https:\/\//.test(url)) { toast('La URL debe empezar por https://'); return; }
  localStorage.setItem(LS.url, url);
  localStorage.setItem(LS.key, key);
  location.reload();
};
$('#btn-desconectar').onclick = () => {
  localStorage.removeItem(LS.url);
  localStorage.removeItem(LS.key);
  location.reload();
};
$('#btn-borrar-local').onclick = () => {
  if (confirm('¿Borrar los datos guardados en este navegador (modo local)?')) {
    TABLAS.forEach(t => localStorage.removeItem('hub_local_' + t));
    location.reload();
  }
};

/* =========================================================
   ARRANQUE
   ========================================================= */
function rellenarSelects() {
  const opts = Object.entries(MIEMBROS).map(([k, v]) => `<option value="${k}">${v.nombre}</option>`).join('');
  $('#ev-miembro').innerHTML = opts;
}

async function iniciar() {
  tick();
  setInterval(tick, 1000);
  setTema(localStorage.getItem(LS.tema) || 'light');
  rellenarSelects();
  semanaCole = lunesDe(new Date());
  setVistaComidas(vistaComidas);
  clima();
  setInterval(clima, 30 * 60 * 1000);
  setInterval(renderCalendario, 60 * 1000);

  const url = localStorage.getItem(LS.url)?.trim();
  const key = localStorage.getItem(LS.key)?.trim();

  if (url && key && window.supabase) {
    try {
      sb = window.supabase.createClient(url, key);
      modoRemoto = true;
      setSync('warn', 'Conectando…');
      await cargarTodo();
    } catch (e) {
      console.error(e);
      modoRemoto = false;
      sb = null;
      toast('No se pudo conectar con Supabase. Funciona en modo local.');
      await cargarTodo();
    }
  } else {
    await cargarTodo();
  }

  await asegurarDefectos();

  if (modoRemoto) conectarRealtime();
  else setSync('local', 'Modo local · configura Supabase en ajustes');
}

iniciar().catch(e => { console.error(e); toast('Error al iniciar la aplicación'); });
</script>
</body>
